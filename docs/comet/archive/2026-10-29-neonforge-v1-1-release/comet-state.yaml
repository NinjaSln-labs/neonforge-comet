rong-platform evidence; focused tests exercise both failure modes.","status":"implemented-with-evidence"},{"evidence":["scripts/release/evidence-bundle.mjs","scripts/release/assemble-evidence.mjs","package.json","tests/release-evidence.test.ts"],"id":"A4","note":"evidence:assemble validates all inputs, copies the exact required evidence set, writes a code-point-sorted manifest with SHA-256 hashes and byte sizes, writes SHA256SUMS, and rejects missing, stale, duplicate, wrong-platform, path-escaping, credential-bearing, or legal-file-deficient inputs. SOURCE_DATE_EPOCH supports byte-stable metadata.","status":"implemented-with-evidence"},{"evidence":["scripts/release/verify-evidence-bundle.mjs","scripts/release/evidence-bundle.mjs","tests/release-evidence.test.ts"],"id":"A5","note":"Offline verification checks schema, current source revision and Git commit, exact platform/protocol coverage, all hashes and sizes, SHA256SUMS, installer size and legal metadata, and credential-shaped fields. Tests verify both a bundle directory and its compressed archive, and reject tampering.","status":"implemented-with-evidence"},{"evidence":[".github/workflows/release-evidence.yml",".github/workflows/release.yml","scripts/release/evidence-bundle.mjs","docs/release/evidence-reproduction.md"],"id":"A6","note":"The native matrix runs typecheck, tests, build:custom, protocol smoke, and persona E2E on macOS/Linux/Windows, runs A/B on Linux, merges platform dist artifacts, assembles/verifies one source-revision-bound bundle, attests it with actions/attest-build-provenance@v3, uploads it, and attaches it to tag releases.","status":"implemented-with-evidence"},{"evidence":["docs/release/evidence-reproduction.md","README.md"],"id":"A7","note":"Documentation lists native-host and provider prerequisites, exact CI/local commands, bundle layout, offline verification, attestation verification, retention, failure handling, SOURCE_DATE_EPOCH, and the boundary between workflow provenance and the external benchmark environment.","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7"],"checks":[{"name":"unit-and-integration-tests","note":"pnpm test passed 45/45.","result":"passed"},{"name":"build-and-installer-verification","note":"pnpm build:custom passed immediately before handoff; the Linux installer legal files matched the repository, package metadata was MIT, and the extracted CLI launched successfully.","result":"passed"},{"name":"installer-size","note":"pnpm release:check passed for all three recorded x64 installers.","result":"passed"},{"name":"baseline-registry","note":"pnpm baseline:verify passed with 2 entries and 3 staged candidates.","result":"passed"},{"name":"bug-hunt-adapter","note":"pnpm baseline:adapter passed the 105-bug, 2-repository contract.","result":"passed"},{"name":"workflow-yaml","note":"All release/persona workflow YAML files parsed successfully with PyYAML.","result":"passed"},{"name":"windows-credential-manager","note":"A live WSL-to-Windows Credential Manager write/read smoke passed with a random credential and the credential was deleted.","result":"passed"}],"knownLimits":["The native macOS/Windows jobs and GitHub artifact attestation were not executed because this checkout has no Git remote, provider secrets, or authorized remote workflow run. The workflow definitions and aggregation behavior were implemented and locally validated.","The previous Runtime check receipts were invalidated because build:custom changed dist during input sampling. They remain preserved and are not reused. The build was rerun manually before this repair candidate; build:custom is intentionally excluded from the repeatable Runtime plan because it mutates generated inputs.","The existing dist directory contains pre-change cross-platform evidence, so local verify:evidence intentionally rejects it until the native release-evidence workflow regenerates one source-bound bundle.","Windows Credential Manager was validated through unit tests and a live WSL-to-Windows PowerShell smoke, not by launching a Node process natively on Windows.","No push, tag, GitHub release, or pull request was performed."],"submittedAt":"2026-10-29T07:25:19.416Z","summary":"Resubmitted the confirmed V1.1 implementation unchanged as the repair candidate. The installer was built manually before handoff; the repeatable Runtime plan now excludes the input-mutating build step and retains non-mutating test, installer-metadata, baseline, and adapter checks.","verificationChecks":[{"argv":["test"],"cwdRef":".","executable":"pnpm","id":"unit-and-integration","name":"Unit and integration tests","repeatable":true,"timeoutMs":120000},{"argv":["release:check"],"cwdRef":".","executable":"pnpm","id":"installer-size","name":"Installer size and release metadata","repeatable":true,"timeoutMs":30000},{"argv":["baseline:verify"],"cwdRef":".","executable":"pnpm","id":"baseline-registry","name":"Offline baseline registry verification","repeatable":true,"timeoutMs":30000},{"argv":["baseline:adapter"],"cwdRef":".","executable":"pnpm","id":"baseline-adapter","name":"Bug Hunt Bench adapter contract","repeatable":true,"timeoutMs":30000}]}},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"neonforge-v1-1-release"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: On Windows, adding a provider stores the API key in Credential Manager and reading the provider retrieves the same value; the key never appears in process arguments, logs, session events, or exports."},{"id":"A2","source":"brief.md","text":"A2: Every generated installer contains a valid MIT `LICENSE`, accurate `THIRD_PARTY_NOTICES`, and package metadata declaring `MIT`; the build fails when a legal file is absent or omitted from the archive."},{"id":"A3","source":"brief.md","text":"A3: Persona smoke and release evidence contain only repository-relative artifact paths, and offline validation 