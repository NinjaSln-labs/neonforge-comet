acceptance:
  - id: A1
    source: brief.md
    text: "A1: On Windows, adding a provider stores the API key in Credential
      Manager and reading the provider retrieves the same value; the key never
      appears in process arguments, logs, session events, or exports."
    result: passed
    reason:
      text: providerSecretForAdd rejects --api-key before any provider/config write
        and accepts only non-TTY stdin for --api-key-stdin. An independent CLI
        probe exited 2 with no config; a piped-key probe through a fake
        secret-tool observed the key on stdin, never in secret-tool argv, and
        config contained only apiKeyRef neonforge:probe. The Windows path sends
        the secret as JSON stdin to an encoded PowerShell command using
        CredWriteW/CredReadW, and the native Windows job ran the focused
        Credential Manager boundary/read tests with 0 failures. Source review
        found no API key in session records, events, or exports.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Every generated installer contains a valid MIT `LICENSE`, accurate
      `THIRD_PARTY_NOTICES`, and package metadata declaring `MIT`; the build
      fails when a legal file is absent or omitted from the archive."
    result: passed
    reason:
      text: scripts/release/build.mjs requires and copies LICENSE and
        THIRD_PARTY_NOTICES, then verifies both archive entries. Independent
        temporary build probes exited 1 with the exact missing-LICENSE and
        missing-THIRD_PARTY_NOTICES errors. The current bundle's Linux, Darwin,
        and Windows installers all declare MIT and contain LICENSE and
        THIRD_PARTY_NOTICES byte-identical to the repository; all are below 50
        MB. Focused assembly tests also reject an installer without the notices.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Persona smoke and release evidence contain only repository-relative
      artifact paths, and offline validation rejects any evidence whose recorded
      source revision differs from the current source manifest."
    result: passed
    reason:
      text: The current bundle's personaReport values are dist/e2e/... and
        release-artifact values are dist/installers/..., with no absolute paths,
        and every evidence record uses revision 074f4ee43706. After changing a
        smoke record to a different revision and recomputing all hashes and
        SHA256SUMS, evidence:verify still exited 1 with a stale-revision error,
        proving revision binding is independent of hash validity.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: `pnpm evidence:assemble` accepts complete native-platform inputs,
      writes a deterministic bundle manifest listing every required file with
      its SHA-256 hash and byte size, and rejects missing, duplicate, stale, or
      wrong-platform evidence."
    result: passed
    reason:
      text: The current complete 19-file native inputs assembled twice with
        SOURCE_DATE_EPOCH=1790000000; bundle.json, SHA256SUMS, and the resulting
        archive were byte-identical across runs, manifest entries were sorted
        and covered all files with SHA-256 and byte size, and sha256sum -c
        passed. Adding a byte-identical protocol-smoke/openai-chat-copy.json
        made the actual evidence:assemble CLI exit 1 with Unexpected evidence
        file and created no output. Focused tests cover missing and
        wrong-platform rejection.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: `pnpm evidence:verify <bundle>` verifies the bundle offline,
      including schema, source revision, all required platforms and protocols,
      installer size and legal files, manifest hashes, and checksum sidecar,
      without reading provider credentials or using the network."
    result: passed
    reason:
      text: The release-evidence artifact downloaded from run 40845662012 has SHA-256
        a4b27e43407fd1764f45b04102ce238de4e9a5a00432eff9487af7c9bec9ecd9 and
        matches the supplied local copy. evidence:verify passed for both the
        archive and extracted directory, reporting revision 074f4ee43706, commit
        ccb3a588bf1a, 19 files, linux/darwin/windows, and all three protocols;
        SHA256SUMS validated all 20 entries. The same command passed inside a
        bwrap network namespace with a clean HOME and no provider credentials,
        and source inspection found no network or credential-reading path.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: The native release-evidence workflow runs the required build, test,
      protocol, persona, and A/B gates on their assigned runners, publishes the
      aggregated bundle, and attests its provenance; it never combines artifacts
      from different source revisions."
    result: passed
    reason:
      text: Run 40845662012 succeeded at ccb3a58. Its native-linux, native-darwin on a
        macos-15-intel x64 runner, and native-windows jobs all completed the
        required privacy, typecheck, test, build, protocol-smoke, and persona
        steps; Linux's paired A/B step also succeeded. The aggregate job
        assembled and verified revision 074f4ee43706, generated and uploaded the
        bundle, and actions/attest-build-provenance@v3 succeeded. gh attestation
        verify passed when constrained to release-evidence.yml, refs/heads/main,
        commit ccb3a58, and subject digest a4b27e43..., with invocationId run
        40845662012/attempts/1. The prior v1.1.0 run 40842737239 also succeeded
        and published an attested archive in the GitHub release.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: `docs/release/evidence-reproduction.md` documents the exact commands,
      required secrets and hosts, artifact retention, verification result, and
      the fact that a bundle proves recorded workflow provenance rather than
      reproducibility of the publisher's external benchmark environment."
    result: passed
    reason:
      text: docs/release/evidence-reproduction.md lines 53-71 now contain the
        Published Verification Result with the v1.1.0 run 40842737239, commit
        a29bf8d, release link, archive name, source revision 7e4c400c2aa5,
        published SHA-256 40d43f75..., exact offline verify command and result,
        and attestation scope. Independently, the release asset digest matched
        that SHA, the tag run and all native/aggregate jobs succeeded,
        evidence:verify passed against a clean clone at a29bf8d, and gh
        attestation verify passed for refs/tags/v1.1.0 and the same archive
        digest. The document also states the required hosts/secrets/retention
        and the provenance-versus-external-benchmark boundary.
      truncated: false
