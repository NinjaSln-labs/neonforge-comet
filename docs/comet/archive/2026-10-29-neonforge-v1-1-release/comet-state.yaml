etrieves the same value; the key never appears in process arguments, logs, session events, or exports."},{"id":"A2","source":"brief.md","text":"A2: Every generated installer contains a valid MIT `LICENSE`, accurate `THIRD_PARTY_NOTICES`, and package metadata declaring `MIT`; the build fails when a legal file is absent or omitted from the archive."},{"id":"A3","source":"brief.md","text":"A3: Persona smoke and release evidence contain only repository-relative artifact paths, and offline validation rejects any evidence whose recorded source revision differs from the current source manifest."},{"id":"A4","source":"brief.md","text":"A4: `pnpm evidence:assemble` accepts complete native-platform inputs, writes a deterministic bundle manifest listing every required file with its SHA-256 hash and byte size, and rejects missing, duplicate, stale, or wrong-platform evidence."},{"id":"A5","source":"brief.md","text":"A5: `pnpm evidence:verify <bundle>` verifies the bundle offline, including schema, source revision, all required platforms and protocols, installer size and legal files, manifest hashes, and checksum sidecar, without reading provider credentials or using the network."},{"id":"A6","source":"brief.md","text":"A6: The native release-evidence workflow runs the required build, test, protocol, persona, and A/B gates on their assigned runners, publishes the aggregated bundle, and attests its provenance; it never combines artifacts from different source revisions."},{"id":"A7","source":"brief.md","text":"A7: `docs/release/evidence-reproduction.md` documents the exact commands, required secrets and hosts, artifact retention, verification result, and the fact that a bundle proves recorded workflow provenance rather than reproducibility of the publisher's external benchmark environment."}],"children":null,"formalHash":"4d08ccee101f0f59ea4b23db0d0033bad1b6a8c1fbb6243fcec0c7f1be7247f6","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b8