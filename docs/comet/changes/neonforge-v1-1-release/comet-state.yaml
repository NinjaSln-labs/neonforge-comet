ry contains pre-change cross-platform evidence, so local verify:evidence intentionally rejects it until the native release-evidence workflow regenerates one source-bound bundle.","Windows Credential Manager was validated through unit tests and a live WSL-to-Windows PowerShell smoke, not by launching a Node process natively on Windows.","No push, tag, GitHub release, or pull request was performed."],"submittedAt":"2026-10-29T07:25:19.416Z","summary":"Resubmitted the confirmed V1.1 implementation unchanged as the repair candidate. The installer was built manually before handoff; the repeatable Runtime plan now excludes the input-mutating build step and retains non-mutating test, installer-metadata, baseline, and adapter checks.","verificationChecks":[{"argv":["test"],"cwdRef":".","executable":"pnpm","id":"unit-and-integration","name":"Unit and integration tests","repeatable":true,"timeoutMs":120000},{"argv":["release:check"],"cwdRef":".","executable":"pnpm","id":"installer-size","name":"Installer size and release metadata","repeatable":true,"timeoutMs":30000},{"argv":["baseline:verify"],"cwdRef":".","executable":"pnpm","id":"baseline-registry","name":"Offline baseline registry verification","repeatable":true,"timeoutMs":30000},{"argv":["baseline:adapter"],"cwdRef":".","executable":"pnpm","id":"baseline-adapter","name":"Bug Hunt Bench adapter contract","repeatable":true,"timeoutMs":30000}]}},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"neonforge-v1-1-release"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: On Windows, adding a provider stores the API key in Credential Manager and reading the provider retrieves the same value; the key never appears in process arguments, logs, session events, or exports."},{"id":"A2","source":"brief.md","text":"A2: Every generated installer contains a valid MIT `LICENSE`, accurate `THIRD_PARTY_NOTICES`, and package metadata declaring `MIT`; the build fails when a legal file is absent or omitted from the archive."},{"id":"A3","source":"brief.md","text":"A3: Persona smoke and release evidence contain only repository-relative artifact paths, and offline validation rejects any evidence whose recorded source revision differs from the current source manifest."},{"id":"A4","source":"brief.md","text":"A4: `pnpm evidence:assemble` accepts complete native-platform inputs, writes a deterministic bundle manifest listing every required file with its SHA-256 hash and byte size, and rejects missing, duplicate, stale, or wrong-platform evidence."},{"id":"A5","source":"brief.md","text":"A5: `pnpm evidence:verify <bundle>` verifies the bundle offline, including schema, source revision, all required platforms and protocols, installer size and legal files, manifest hashes, and checksum sidecar, without reading provider credentials or using the network."},{"id":"A6","source":"brief.md","text":"A6: The native release-evidence workflow runs the required build, test, protocol, persona, and A/B gates on their assigned runners, publishes the aggregated bundle, and attests its provenance; it never combines artifacts from different source revisions."},{"id":"A7","source":"brief.md","text":"A7: `docs/release/evidence-reproduction.md` documents the exact commands, required secrets and hosts, artifact retention, verification result, and the fact that a bundle proves recorded workflow provenance rather than reproducibility of the publisher's external benchmark environment."}],"children":null,"formalHash":"4d08ccee101f0f59ea4b23db0d0033bad1b6a8c1fbb6243fcec0c7f1be7247f6","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"fb9a5d971d542a14f79fc5d8b0f0bb4134172bbae891fea4b6773aba036d4a53","contractHash":"d50fc385dd6df5e236597653accf423261edf4530cb263cccdfbd98c6e8f04bd","inputHash":"6eab2b50b9a315eae9f5dfdb513565a8e5ec0948cfd9ff7e0ce1b1aa068456cc","lega