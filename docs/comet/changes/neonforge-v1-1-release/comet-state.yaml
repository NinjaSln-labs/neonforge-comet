3-141 emits a repository-relative personaReport, and scripts/release/build.mjs:74-91 emits a relative artifact path. Stale checks in scripts/release/check-evidence.mjs and scripts/release/evidence-bundle.mjs:122-128 reject revision mismatches; an independent pnpm verify:evidence run failed closed on the stale dist records.","result":"passed"},{"id":"A4","reason":"Complete input assembly, canonical manifest ordering, SHA-256/byte sizes, missing/stale/wrong-platform checks, and archive verification pass. However assembly iterates only REQUIRED_FILES and does not reject extra duplicate evidence: an independently copied byte-identical protocol-smoke/openai-chat-copy.json was accepted and ignored. Duplicate rejection exists in verifyEvidenceBundle at scripts/release/evidence-bundle.mjs:445-448, not in evidence:assemble as required.","result":"failed"},{"id":"A5","reason":"scripts/release/evidence-bundle.mjs:418-559 validates schema, source revision and Git commit, exact platform/protocol coverage, canonical ordering, every payload hash and size, SHA256SUMS, installer size/legal metadata, and credential-shaped content without network or provider access. An independent complete fixture passed pnpm evidence:verify, and a duplicate manifest entry was rejected.","result":"passed"},{"id":"A6","reason":"The workflow YAML implements the native matrix gates, Linux-only A/B, aggregation, verification, artifact publication, and actions/attest-build-provenance@v3. No executed provenance can be confirmed: this checkout has no Git remote, no matching remote repository was found, and there is no workflow run or attestation to inspect. Implemented capability is not evidence that native jobs or attestation ran.","result":"blocked"},{"id":"A7","reason":"docs/release/evidence-reproduction.md documents native-host prerequisites, required provider secrets, workflow-dispatch and tag usage, exact local commands, retention, offline verification checks and result output expectations, failure handling, and the provenance-versus-external-benchmark-environment boundary.","result":"passed"}],"attempt":1,"iteration":2,"risks":["Current dist contains stale pre-change macOS/Windows installers that lack LICENSE and THIRD_PARTY_NOTICES and are rejected by verify:evidence; they must not be published and require a native workflow rebuild.","No GitHub workflow run or artifact attestation exists to prove native macOS/Windows execution or published provenance.","Windows Credential Manager behavior was not independently executed on a native Windows host in this verifier session; only the mocked boundary and source were inspected.","Duplicate evidence at extra non-required input paths is silently ignored rather than rejected by the assembler."],"summary":"Independent verification found two defects: the CLI exposes the provider key in NeonForge process arguments before the secure PowerShell boundary (A1), and evidence:assemble does not reject extra duplicate input evidence (A4). A2/A3/A5/A7 are supported by source, tests, receipts, and read-only probes. A6 is implemented in workflow YAML but execution, publication, and attestation are blocked by the absence of a remote workflow run and attestation evidence.","verdict":"fail"}},"verifierExecutionRef":"codex-verifier-neonforge-v1-1-release-20261029"}},{"sequence":10,"value":{"acceptanceReview":[{"evidence":["apps/cli/src/main.ts","apps/cli/src/provider-secret.ts","tests/provider-secret.test.ts","packages/config/src/index.ts","tests/security-config.test.ts","README.md"],"id":"A1","note":"Provider add no longer accepts --api-key because that would expose the secret in NeonForge process arguments. Keys are read only from piped stdin via --api-key-stdin, or can remain in NEONFORGE_API_KEY/OPENAI_API_KEY. The Windows and Linux secret-store boundaries receive the key only after stdin parsing. Tests reject inline argv keys, validate piped input, and a CLI integration smoke stored a piped key through a fake secret-tool.","status":"implemented-with-evidence"},{"evidence":["LICENSE","THIRD_PARTY_NOTICES","package.json","scripts/release/build.mjs","tests/release-evidence.test.ts","dist/installers/release-linux-x64.json"],"id":"A2","note":"MIT licensing is declared in package metadata. Packaging requires and copies both legal files, verifies they are present in the archive, records license metadata, and rejects installers missing either legal file. The rebuilt Linux installer was extracted and its legal files, metadata, and CLI launch were checked.","status":"implemented-with-evidence"},{"evidence":["scripts/e2e/run-personas.mjs","scripts/release/build.mjs","scripts/release/check-evidence.mjs","tests/release-evidence.test.ts"],"id":"A3","note":"Persona and release evidence emit repository-relative paths. Assembly and offline verification reject stale source revisions and wrong-platform evidence; focused tests exercise both failure modes.","status":"implemented-with-evidence"},{"evidence":["scripts/release/evidence-bundle.mjs","scripts/release/assemble-evidence.mjs","package.json","tests/release-evidence.test.ts"],"id":"A4","note":"evidence:assemble now rejects unexpected files in every evidence directory before copying anything, including byte-identical duplicate protocol copies. It also retains exact required-file coverage, canonical ordering, SHA-256 hashes and sizes, stale/wrong-platform rejection, credential scanning, and legal-file validation. The new duplicate-input test passes.","status":"implemented-with-evidence"},{"evidence":["scripts/release/verify-evidence-bundle.mjs","scripts/release/evidence-bundle.mjs","tests/release-evidence.test.ts"],"id":"A5","note":"Offline verification checks schema, current source revision and Git commit, exact platform/protocol coverage, all hashes and sizes, SHA256SUMS, installer size and legal metadata, and credential-shaped fields. Tests verify both a bundle directory and its compressed archive, and reject tampering.","status":"implemented-with-evidence"},