acceptance:
  - id: A1
    source: brief.md
    text: "A1: On Windows, adding a provider stores the API key in Credential
      Manager and reading the provider retrieves the same value; the key never
      appears in process arguments, logs, session events, or exports."
    result: passed
    reason:
      text: providerSecretForAdd now rejects --api-key with a process-argument
        exposure error before store/config writes, and --api-key-stdin reads
        only piped input. A CLI probe with --api-key exited 2 without creating
        provider state; a piped-key probe through a fake secret-tool observed
        the key on stdin, not in secret-tool argv, stdout, stderr, or config
        (config held only neonforge:probe). The Windows Credential Manager
        boundary passes the key in JSON stdin to PowerShell, not argv; mocked
        Windows store/read tests passed.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Every generated installer contains a valid MIT `LICENSE`, accurate
      `THIRD_PARTY_NOTICES`, and package metadata declaring `MIT`; the build
      fails when a legal file is absent or omitted from the archive."
    result: passed
    reason:
      text: scripts/release/build.mjs requires LICENSE and THIRD_PARTY_NOTICES from
        the repository, copies them into staging, checks both archive entries,
        and records MIT/legal metadata. The fresh Linux installer contains both
        files byte-identical to the repository and package metadata declares
        MIT; a temporary missing-LICENSE build probe failed with the required
        error, and focused tests reject an installer missing
        THIRD_PARTY_NOTICES.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Persona smoke and release evidence contain only repository-relative
      artifact paths, and offline validation rejects any evidence whose recorded
      source revision differs from the current source manifest."
    result: passed
    reason:
      text: scripts/e2e/run-personas.mjs emits personaReport via a repository-relative
        path and scripts/release/build.mjs emits a relative installer path.
        Assembly and offline evidence validation compare workspaceRevision to
        the current source revision and reject stale or unsafe paths. Running
        the offline validator against the current dist failed closed with 20
        stale-revision/legal/path failures.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: `pnpm evidence:assemble` accepts complete native-platform inputs,
      writes a deterministic bundle manifest listing every required file with
      its SHA-256 hash and byte size, and rejects missing, duplicate, stale, or
      wrong-platform evidence."
    result: passed
    reason:
      text: A complete 19-file native-platform fixture assembled successfully,
        produced canonically sorted SHA-256/byte-size entries, had a
        byte-identical manifest across two runs with the same SOURCE_DATE_EPOCH,
        and passed sha256sum -c for every manifest entry. Adding byte-identical
        protocol-smoke/openai-chat-copy.json made the actual assemble-evidence
        CLI exit 1 with an unexpected-evidence-file error and created no output.
        Focused tests also passed missing/stale/wrong-platform rejection.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: `pnpm evidence:verify <bundle>` verifies the bundle offline,
      including schema, source revision, all required platforms and protocols,
      installer size and legal files, manifest hashes, and checksum sidecar,
      without reading provider credentials or using the network."
    result: passed
    reason:
      text: The clean 19-file bundle verified both as a directory and as its .tgz
        archive, covering schema, current source revision/Git commit,
        linux/darwin/windows, all three protocols, every manifest hash and byte
        size, SHA256SUMS, installer size/legal files, and credential-shaped
        content. Source inspection found no network, provider credential, or
        provider environment access in the verifier path, and
        tamper/credential-leak focused tests passed.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: The native release-evidence workflow runs the required build, test,
      protocol, persona, and A/B gates on their assigned runners, publishes the
      aggregated bundle, and attests its provenance; it never combines artifacts
      from different source revisions."
    result: blocked
    reason:
      text: The workflow YAML implements the native matrix, required gates,
        aggregation, publication, and actions/attest-build-provenance@v3.
        However git remote -v is empty, gh run list fails because there is no
        base repository, and no workflow run, published bundle, or GitHub
        attestation exists in this checkout. Implemented workflow capability is
        not proof that native jobs or attestation executed.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: `docs/release/evidence-reproduction.md` documents the exact commands,
      required secrets and hosts, artifact retention, verification result, and
      the fact that a bundle proves recorded workflow provenance rather than
      reproducibility of the publisher's external benchmark environment."
    result: passed
    reason:
      text: docs/release/evidence-reproduction.md documents native hosts, required
        OPENAI_* secrets, workflow-dispatch/tag commands, exact local
        build/test/assemble/verify commands, retention (14/30 days and durable
        release attachment), offline verification behavior and fail-closed
        handling, attestation verification, and the
        provenance-versus-external-benchmark boundary.
      truncated: false
