name: release-evidence

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload the attested evidence bundle to the GitHub release
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish_release:
        description: Upload the attested evidence bundle to the GitHub release
        required: false
        default: false
        type: boolean

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  platform:
    name: native-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15-intel
            platform: darwin
          - os: windows-latest
            platform: windows
    env:
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'deepseek-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm privacy:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:custom
      - run: pnpm smoke:protocols
      - run: pnpm test:personas
      - name: Paired A/B benchmark
        if: matrix.platform == 'linux'
        run: pnpm benchmark:ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: aggregate-and-attest
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: dist
          merge-multiple: true
      - run: pnpm evidence:assemble --input dist --output dist/release-evidence
      - run: pnpm evidence:verify dist/release-evidence --workspace .
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/neonforge-release-evidence-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-bundle
          path: |
            dist/release-evidence
            dist/neonforge-release-evidence-*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release assets
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/neonforge-release-evidence-*.tgz \
            dist/release-evidence/SHA256SUMS \
            --clobber
